name: wavepod
options:
  bundleIdPrefix: app.wavepod
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    ARCHS: arm64
packages:
  WavepodKit:
    path: WavepodKit
targets:
  wavepod:
    type: application
    platform: macOS
    sources: [App/Sources, App/Resources]
    dependencies:
      - target: wavepod-feeds
      - target: WavepodEngine
        embed: true
      - package: WavepodKit
        product: UI
    postBuildScripts:
      - name: Embed feed checker
        script: |
          mkdir -p "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Library/LaunchAgents"
          cp "$SRCROOT/App/LaunchAgents/app.wavepod.feeds.plist" "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Library/LaunchAgents/"
          cp "$BUILT_PRODUCTS_DIR/wavepod-feeds" "$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/"
          if [ "$CODE_SIGNING_ALLOWED" != "NO" ] && [ -n "$EXPANDED_CODE_SIGN_IDENTITY" ]; then
            codesign --force --options runtime --sign "$EXPANDED_CODE_SIGN_IDENTITY" "$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/wavepod-feeds"
          fi
        basedOnDependencyAnalysis: false
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Wavepod
        CFBundleDocumentTypes:
          - CFBundleTypeName: Audio and Video
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.audio, public.movie]
        LSApplicationCategoryType: public.app-category.productivity
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: "Connect to your own Scriberr transcription server."
        NSHumanReadableCopyright: "Apache-2.0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.wavepod.mac
        PRODUCT_NAME: Wavepod
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "-"
        GENERATE_INFOPLIST_FILE: YES

  WavepodEngine:
    type: xpc-service
    platform: macOS
    sources: [App/EngineService]
    info:
      path: App/EngineService/Info.plist
      properties:
        XPCService:
          ServiceType: Application
    dependencies:
      - package: WavepodKit
        product: NativeEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.wavepod.engine
        CODE_SIGN_IDENTITY: "-"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundlePackageType: XPC!
        SKIP_INSTALL: YES

  wavepod-feeds:
    type: tool
    platform: macOS
    sources: [App/FeedService]
    dependencies:
      - package: WavepodKit
        product: Pipeline
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.wavepod.feeds
        SWIFT_PARSE_AS_LIBRARY: YES
        CODE_SIGN_IDENTITY: "-"
        SKIP_INSTALL: YES
