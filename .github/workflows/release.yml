# Release (docs/decisions/0005): a version tag builds the .dmg with tools/release.sh and attaches it to a GitHub
# Release. Each signing stage runs only when its secrets exist:
#
#   no secrets                 ad-hoc build, published as a pre-release marked "testing only"
#   + Developer ID + notary    signed, notarized and stapled release
#   + Sparkle private key      also adds the release to the appcast on gh-pages, which updates installed copies
#
# A manual run builds the .dmg as a workflow artifact and publishes nothing. Secrets: docs/development.md#release.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to stamp into the test build
        default: "0.0.0-dev"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      TAG: ${{ github.ref_name }}
      VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
      BUILD: ${{ github.run_number }}
      SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
      HAS_DEVELOPER_ID: ${{ secrets.DEVELOPER_ID_P12 != '' }}
      HAS_NOTARY: ${{ secrets.NOTARY_KEY_P8 != '' }}
      HAS_SPARKLE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sudo xcode-select -s "$(find /Applications -maxdepth 1 -name 'Xcode_*.app' | sort -V | tail -1)"
          xcodebuild -version
          xcrun metal --version >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
          brew install xcodegen
          echo "VERSION=${VERSION#v}" >> "$GITHUB_ENV"

      - name: Import Developer ID certificate
        if: env.HAS_DEVELOPER_ID == 'true'
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          kc="$RUNNER_TEMP/signing.keychain-db"
          kc_password="$(uuidgen)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$kc_password" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kc_password" "$kc"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$kc_password" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" login.keychain-db
          rm "$RUNNER_TEMP/developer-id.p12"
          identity="$(security find-identity -v -p codesigning "$kc" | awk '/Developer ID Application/ { print $2; exit }')"
          test -n "$identity"
          echo "DEVELOPER_ID=$identity" >> "$GITHUB_ENV"

      - name: Notary key
        if: env.HAS_DEVELOPER_ID == 'true' && env.HAS_NOTARY == 'true'
        env:
          P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          echo "$P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          {
            echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary.p8"
            echo "NOTARY_KEY_ID=$NOTARY_KEY_ID"
            echo "NOTARY_ISSUER=$NOTARY_ISSUER"
          } >> "$GITHUB_ENV"

      - name: Build .dmg
        run: |
          dmg="$(tools/release.sh | tail -1)"
          echo "DMG=$dmg" >> "$GITHUB_ENV"
          if [ -n "${NOTARY_KEY_PATH:-}" ]; then echo "NOTARIZED=true" >> "$GITHUB_ENV"; fi

      - uses: actions/upload-artifact@v4
        with:
          name: Wavepod-${{ env.VERSION }}
          path: ${{ env.DMG }}

      - name: GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The notes are docs/releases/$VERSION.md when the release has them, else GitHub's list of merged PRs.
          notes="$RUNNER_TEMP/notes.md"
          if [ -f "docs/releases/$VERSION.md" ]; then cp "docs/releases/$VERSION.md" "$notes"; else : > "$notes"; fi
          if [ "${NOTARIZED:-}" = true ]; then
            if [ -s "$notes" ]; then
              gh release create "$TAG" "$DMG" --title "Wavepod $VERSION" --notes-file "$notes"
            else
              gh release create "$TAG" "$DMG" --title "Wavepod $VERSION" --generate-notes
            fi
          else
            { echo "> Ad-hoc signed and not notarized: for testing only. macOS will refuse to open it until you allow it in System Settings → Privacy & Security."
              echo; cat "$notes"; } > "$notes.test"
            gh release create "$TAG" "$DMG" --title "Wavepod $VERSION (test build)" --prerelease --notes-file "$notes.test"
          fi

      - name: Appcast
        # Only notarized builds go into the appcast: installed copies must never update to an ad-hoc build.
        if: github.event_name == 'push' && env.NOTARIZED == 'true' && env.HAS_SPARKLE_KEY == 'true'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          REPO: ${{ github.repository }}
        run: |
          pages="$RUNNER_TEMP/pages"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git clone --depth 1 --branch gh-pages "https://x-access-token:${{ github.token }}@github.com/$REPO.git" "$pages"
          else
            git init -b gh-pages "$pages"
            git -C "$pages" remote add origin "https://x-access-token:${{ github.token }}@github.com/$REPO.git"
          fi
          archives="$RUNNER_TEMP/archives"
          mkdir -p "$archives"
          cp "$DMG" "$archives/"
          echo "$SPARKLE_PRIVATE_KEY" | build/release/SourcePackages/artifacts/sparkle/Sparkle/bin/generate_appcast \
            --ed-key-file - --download-url-prefix "https://github.com/$REPO/releases/download/$TAG/" \
            --link "https://github.com/$REPO" -o "$pages/appcast.xml" "$archives"
          cd "$pages"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appcast.xml
          git commit -m "Appcast: Wavepod $VERSION"
          git push origin gh-pages
